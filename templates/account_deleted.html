{% extends "base.html" %}
{% block body_class %}account-deleted-page{% endblock %}
{% block title %}회원탈퇴 완료 | 피모북{% endblock %}

{% block extra_head %}
<style>
  .account-deleted {
    width: 100%;
    max-width: 520px;
    padding: 18px 0;
    text-align: center;
  }
  .account-deleted-icon {
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: #ecfdf5;
    color: #059669;
    font-size: 23px;
  }
  .account-deleted h1 {
    margin: 0;
    color: #172033;
    font-size: 27px;
    font-weight: 950;
  }
  .account-deleted p {
    margin: 10px 0 22px;
    color: #64748b;
    font-size: 14px;
    line-height: 1.65;
  }
  .account-deleted a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 18px;
    border: 1px solid #059669;
    border-radius: 11px;
    background: #059669;
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    text-decoration: none;
  }
</style>
{% endblock %}

{% block content %}
<section class="account-deleted">
  <span class="account-deleted-icon"><i class="bi bi-check-lg" aria-hidden="true"></i></span>
  <h1>회원탈퇴가 완료되었습니다.</h1>
  <p>계정 개인정보와 선수 리뷰 관련 데이터가 삭제되었으며 기존 게시글과 댓글의 작성자는 익명 처리되었습니다.</p>
  <a href="{{ url_for('index') }}">피모북 홈으로</a>
</section>
{% endblock %}

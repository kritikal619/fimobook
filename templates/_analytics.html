{% if ga_measurement_id %}
<!-- Google Analytics: 피모북 공통 GA4 태그 -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_measurement_id|e }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', {{ ga_measurement_id|tojson }});
</script>
{% endif %}

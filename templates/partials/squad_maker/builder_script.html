        const userAgent = navigator.userAgent || navigator.vendor || window.opera || "";
        const mobileUserAgent = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
        const coarsePointer = window.matchMedia("(pointer: coarse)").matches;
        const noHover = window.matchMedia("(hover: none)").matches;
        const narrowScreen = Math.min(window.innerWidth, window.innerHeight) <= 1024;
        return mobileUserAgent || (coarsePointer && noHover && narrowScreen);
    }

    function isBenchSlot(slotName) {
        return BENCH_SLOT_NAMES.includes(slotName);
    }

    function getBenchSlotIndex(slotName) {
        return BENCH_SLOT_NAMES.indexOf(slotName) + 1;
    }

    function ensureBenchState() {
        if (!G.bench || typeof G.bench !== "object") {
            G.bench = {};
        }
        BENCH_SLOT_NAMES.forEach(slotName => {
            if (!G.bench[slotName] || typeof G.bench[slotName] !== "object") {
                G.bench[slotName] = { playerData: null };
            }
        });
    }

    function getSlotState(slotName) {
        return isBenchSlot(slotName) ? G.bench[slotName] : G.squad[slotName];
    }

    function getSlotPlayer(slotName) {
        return getSlotState(slotName)?.playerData || null;
    }

    function getSlotLabel(slotName) {
        if (isBenchSlot(slotName)) {
            return `교체 ${getBenchSlotIndex(slotName)}`;
        }
        return formationData[G.currentFormation]?.[slotName]?.text || "SLOT";
    }

    function getSlotSearchPosition(slotName) {
        if (isBenchSlot(slotName)) {
            return "";
        }
        return formationData[G.currentFormation]?.[slotName]?.text || "";

    function getCompareSlotSearchPosition(slotName) {
        if (isBenchSlot(slotName)) {

            DOM.mobileOverlayFormationSelect.value = G.currentFormation;
        }
        changeFormation(G.currentFormation, { preserveExisting: true });
        setupSquadSearchFilters();

        G.squadPriceRefreshTimer = window.setInterval(() => {
            if (!document.hidden) refreshSquadMarketPrices();
        }, 5 * 60 * 1000);

    function loadPersistedState() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return;
            const saved = JSON.parse(raw);
            if (saved && formationData[saved.formation]) {
                G.currentFormation = saved.formation;
            }
            if (saved && saved.squad && typeof saved.squad === "object") {
                G.squad = saved.squad;
            }
            if (saved && saved.bench && typeof saved.bench === "object") {
                G.bench = saved.bench;
            }
            G.defaultConfig = FimoSquad.normalizeConfig(saved?.defaultConfig);
            if (saved && saved.selectedSlotName) {
                G.selectedSlotName = isBenchSlot(saved.selectedSlotName) ? null : saved.selectedSlotName;
            }
            [...Object.values(G.squad), ...Object.values(G.bench)].forEach(slot => {
                const player = slot?.playerData;
                if (!player) return;
                if (
                    String(player.pimage || "").includes("/static/faceon/")
                    && !String(player.pimage || "").includes("?v=v2")
                ) {
                    delete player.pimage;
                }
                ["pimageThumb", "pimageThumbSmall"].forEach(key => {
                    if (
                        String(player[key] || "").includes("/media/player/v1/faceon/")
                    ) {
                        delete player[key];
                    }
                });
                ["bimage", "bimageThumb", "bimageThumbSmall"].forEach(key => {
                    if (/^https?:\/\//i.test(String(player[key] || ""))) {
                        delete player[key];
                    }
                });
            });
        } catch (error) {
            console.warn("Failed to load squad state", error);
        }
    }

    function persistState(message = "자동 저장됨") {
        const payload = {
            formation: G.currentFormation,
            selectedSlotName: G.selectedSlotName,
            squad: G.squad,
            bench: G.bench,
            defaultConfig: G.defaultConfig,
        };
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            DOM.autosaveStatus.textContent = message;
        } catch (error) {
            DOM.autosaveStatus.textContent = "자동 저장 실패 · 스쿼드 파일로 저장해 주세요";
        }
    }

    function changeFormation(formationName, options = {}) {
        const preserveExisting = options.preserveExisting !== false;
        const previousPositions = formationData[G.currentFormation];
        G.currentFormation = formationName;
        DOM.formationSelect.value = formationName;
        DOM.formationPill.textContent = formationName;
        if (DOM.mobileOverlayFormationSelect) {
            DOM.mobileOverlayFormationSelect.value = formationName;
        }
        DOM.squadDiv.innerHTML = "";

        const previousSquad = preserveExisting ? { ...G.squad } : {};
        const positions = formationData[formationName];
        G.squad = FimoSquad.remapFormation(previousSquad, positions, previousPositions);
        updateMobileFieldHeight();
        Object.keys(positions).forEach(name => {
            createSlot(name, positions[name]);
        });
        layoutSquadSlots(positions);

        if (!G.selectedSlotName || !G.squad[G.selectedSlotName]) {
            G.selectedSlotName = Object.keys(G.squad)[0] || null;
        }
        updateAll();
        persistState("포메이션 저장됨");
    }

    function updateMobileFieldHeight() {
        if (!DOM.fieldScroll || !DOM.appShell) return;
        if (!isMobileLayout() || document.body.classList.contains("mobile-landscape")) {
            document.documentElement.style.removeProperty("--mobile-field-height");
            return;
        }
        const bottomPadding = parseFloat(window.getComputedStyle(DOM.appShell).paddingBottom) || 0;
        const availableHeight = Math.max(420, Math.floor(
            window.innerHeight - DOM.fieldScroll.getBoundingClientRect().top
            - window.scrollY - DOM.appShell.scrollTop - bottomPadding
        ));
        document.documentElement.style.setProperty("--mobile-field-height", `${availableHeight}px`);
    }

    function getSlotMetrics(element) {
        const styles = window.getComputedStyle(element);
        return { width: parseFloat(styles.width), height: parseFloat(styles.height) };
    }

    function getSlotPlacement(name, posData, portrait = document.body.classList.contains("mobile-layout") && !document.body.classList.contains("mobile-landscape")) {
        const slotText = (posData.text || "").toUpperCase();
        let left = 50 + (posData.left - 50) * (portrait ? 1.48 : 1.25);
        let top = posData.top;
        if (["LW", "RW", "ST", "CF", "LF", "RF"].includes(slotText)) top -= 6;
        else if (["LM", "RM", "CM", "CDM", "CAM"].includes(slotText)) top -= 3;
        else if (name.startsWith("df")) top -= 5;
        if (name === "gk" || slotText === "GK") {
            left = 50;
            top = 89;
        }
        left = Math.max(12, Math.min(88, left));
        top = Math.max(12, Math.min(89, top));
        return { left, top };
    }

    function calculateSquadLayout(positions, field, { landscape = false, portrait = false } = {}) {
        let cardWidth = 1;
        const placements = new Map(Object.entries(positions).map(([name, position]) =>
            [name, getSlotPlacement(name, position, portrait)]
        ));
        if (portrait) {
            // Use the phone's full width for each line while preserving player order.
            for (const line of ["df", "mf", "fw"]) {
                const players = [...placements].filter(([name]) => name.startsWith(line))
                    .sort((a, b) => a[1].left - b[1].left || a[1].top - b[1].top);
                const columns = [];
                players.forEach(player => {
                    const last = columns[columns.length - 1];
                    if (last && Math.abs(last[0][1].left - player[1].left) < 2) last.push(player);
                    else columns.push([player]);
                });
                const edge = ({ 1: 50, 2: 32, 3: 24, 4: 14, 5: 12 })[columns.length];
                columns.forEach((column, index) => {
                    column.forEach(([name]) => {
                        placements.get(name).left = columns.length === 1 ? 50
                            : edge + index * (100 - edge * 2) / (columns.length - 1);
                    });
                });
            }
        }
        {
            if (!field.width || !field.height) return null;
            const centers = [...placements].map(([name, placement]) => ({
                name, x: field.width * placement.left / 100, y: field.height * placement.top / 100,
            })).sort((a, b) => a.y - b.y);
            const rows = [];
            const rowForCenter = centers.map((center, index) => {
                const last = rows[rows.length - 1];
                if (!landscape && last && Math.abs(last.y - center.y) < .01) last.indices.push(index);
                else rows.push({ y: center.y, indices: [index] });
                return rows.length - 1;
            });
            const labelHeight = landscape ? 12 : (portrait ? 18 : 20);
            const gap = landscape ? 6 : (portrait ? 8 : 12);
            // Preserve formation order and spread crowded rows before shrinking cards.
            function fit(width) {
                const spacing = width * 1.2 + labelHeight + gap;
                const minimum = rows.map(() => width * .6 + labelHeight + gap);
                const maximum = rows.map(() => field.height - width * .6 - gap);
                const predecessors = centers.map((center, index) =>
                    centers.slice(0, index).map((other, previous) => ({ other, previous }))
                        .filter(({ other }) => Math.abs(center.x - other.x) < width + gap)
                        .map(({ previous }) => ({ previous, distance: spacing }))
                );
                if (!landscape) {
                    centers.forEach((center, index) => {
                        if (!index) return;
                        const delta = center.y - centers[index - 1].y;
                        if (delta < field.height * .08 && !predecessors[index].some(link => link.previous === index - 1)) {
                            predecessors[index].push({ previous: index - 1, distance: delta });
                        }
                    });
                }
                const rowPredecessors = rows.map(row => row.indices.flatMap(index =>
                    predecessors[index].map(link => ({ previous: rowForCenter[link.previous], distance: link.distance }))
                        .filter(link => link.previous !== rowForCenter[index])
                ));
                rows.forEach((_, index) => {
                    rowPredecessors[index].forEach(({ previous, distance }) => {
                        minimum[index] = Math.max(minimum[index], minimum[previous] + distance);
                    });
                });
                for (let index = rows.length - 1; index >= 0; index--) {
                    rowPredecessors[index].forEach(({ previous, distance }) => {
                        maximum[previous] = Math.min(maximum[previous], maximum[index] - distance);
                    });
                }
                if (minimum.some((value, index) => value > maximum[index])) return null;
                const result = [];
                rows.forEach((row, index) => {
                    let y = Math.max(minimum[index], Math.min(maximum[index], row.y));
                    rowPredecessors[index].forEach(({ previous, distance }) => { y = Math.max(y, result[previous] + distance); });
                    result.push(y);
                });
                return rowForCenter.map(index => result[index]);
            }
            const preferredWidth = landscape ? 76 : Math.min(portrait ? 132 : 140, field.width * (portrait ? .23 : .15));
            const rowWidths = landscape ? [] : centers.flatMap((center, index) =>
                centers.slice(0, index)
                    .filter(other => Math.abs(center.y - other.y) < field.height * .065 && Math.abs(center.x - other.x) > 1)
                    .map(other => Math.abs(center.x - other.x) - gap)
            );
            let width = Math.max(1, Math.floor(Math.min(preferredWidth, ...rowWidths, ...centers.map(center =>
                2 * Math.min(center.x, field.width - center.x) - gap
            ))));
            let fitted = fit(width);
            while (!fitted && width > 1) fitted = fit(--width);
            cardWidth = width;
            centers.forEach((center, index) => {
                placements.get(center.name).top = fitted[index] / field.height * 100;
            });
        }
        return { width: cardWidth, placements };
    }

    function layoutSquadSlots(positions) {
        DOM.squadDiv.style.removeProperty("--slot-width");
        const landscape = document.body.classList.contains("mobile-landscape");
        const portrait = document.body.classList.contains("mobile-layout") && !landscape;
        const layout = calculateSquadLayout(positions, DOM.squadDiv.getBoundingClientRect(), { landscape, portrait });
        if (!layout) return;
        const { placements } = layout;
        DOM.squadDiv.style.setProperty("--slot-width", `${layout.width}px`);
        Object.entries(positions).forEach(([name, position]) => {
            const element = document.getElementById(`pos-${name}`);
            const metrics = getSlotMetrics(element);
            const placement = placements.get(name);
            element.style.left = `calc(${placement.left}% - ${metrics.width / 2}px)`;
            element.style.top = `calc(${placement.top}% - ${metrics.height / 2}px)`;
        });
    }

    function createSlot(name, posData, options = {}) {
        const isBenchPosition = options.bench === true;
        const slotEl = document.createElement("div");
        slotEl.className = isBenchPosition ? "position bench-position" : "position";
        slotEl.id = `pos-${name}`;
        slotEl.dataset.name = name;
        slotEl.dataset.slot = getSlotLabel(name);
        (isBenchPosition ? DOM.benchSlots : DOM.squadDiv).appendChild(slotEl);

        if (!isBenchPosition && posData) {
            const { width: slotWidth, height: slotHeight } = getSlotMetrics(slotEl);
            const placement = getSlotPlacement(name, posData);
            slotEl.style.left = `calc(${placement.left}% - ${slotWidth / 2}px)`;
            slotEl.style.top = `calc(${placement.top}% - ${slotHeight / 2}px)`;
        }

        slotEl.innerHTML = `
            <div class="slot-badge">${options.badgeText || getSlotLabel(name)}</div>
            <div class="player-card">
                <div class="card-background"></div>
                <div class="player-image"></div>
                <div class="card-overlay"></div>
                <div class="ovr-position-top">
                    <div class="ovr"></div>
                    <div class="pos-text"></div>
                </div>
                <div class="player-name-bottom"></div>
                <div class="squad-card-growth"></div>
                <div class="squad-card-playstyles"></div>
                <div class="slot-plus">+</div>
                <button class="compare-btn" type="button" aria-label="선수 비교">vs</button>
                <a class="detail-btn" target="_self" aria-label="상세 보기">↗</a>
                <button class="remove-btn" type="button" aria-label="선수 제거">×</button>
            </div>
        `;

        slotEl.addEventListener("click", event => {
            if (
                event.target.closest(".remove-btn")
                || event.target.closest(".detail-btn")
                || event.target.closest(".compare-btn")
            ) {
                return;
            }
            selectSlot(name);
            if (getSlotPlayer(name)) {
                FimoSquad.openPlayer(name);
                return;
            }
            openSearchModal(name);
        });

        slotEl.querySelector(".remove-btn").addEventListener("click", event => {
            event.stopPropagation();
            if (isMobileLayout() && !slotEl.classList.contains("action-ready")) return;
            const slotState = getSlotState(name);
            if (!slotState) return;
            slotState.playerData = null;
            selectSlot(name);
            updateAll();
            persistState("선수 제거됨");
        });

        slotEl.querySelector(".detail-btn").addEventListener("click", event => {
            event.stopPropagation();
            if (isMobileLayout()) {
                event.preventDefault();
                return;
            }
        });

        slotEl.querySelector(".compare-btn").addEventListener("click", event => {
            event.stopPropagation();
            if (isMobileLayout()) return;
            if (!getSlotPlayer(name)) return;
            openCompareSearchModal(name);
        });

        slotEl.tabIndex = 0;
        slotEl.setAttribute("role", "button");
        slotEl.addEventListener("keydown", event => {
            if (event.target !== slotEl || !["Enter", " "].includes(event.key)) return;
            event.preventDefault();
            slotEl.click();
        });
    }

    function selectSlot(name) {
        clearTimeout(G.mobileActionReadyTimer);
        G.selectedSlotName = name;
        updateSelectedSlotCopy();
        updateSelectedPlayerActionButtons();
        document.querySelectorAll(".position").forEach(node => {
            node.classList.toggle("selected", node.dataset.name === name);
            node.classList.remove("action-ready");
        });

        if (!isMobileLayout() || !name || !getSlotPlayer(name)) return;

        G.mobileActionReadyTimer = setTimeout(() => {
            if (G.selectedSlotName !== name) return;
            const slotEl = document.getElementById(`pos-${name}`);
            if (slotEl) {
                slotEl.classList.add("action-ready");
            }
        }, 220);
    }

    function clearSlotSelection() {
        if (!G.selectedSlotName) return;
        selectSlot(null);
    }

    function isOverlayOpen() {
        return DOM.modal.classList.contains("open")
            || DOM.compareSearchModal.classList.contains("open")
            || DOM.comparePanel.classList.contains("open")
            || !!document.querySelector(".squad-dialog[open]");
    }

    function getCareerLeagueTeams() {
        return DOM.modalAllCareerFilter.checked ? ALL_LEAGUE_TEAMS : CURRENT_LEAGUE_TEAMS;
    }

    function rebuildCareerTeamOptions(preferredTeam = "") {
        const teams = getCareerLeagueTeams()[DOM.modalLeagueFilter.value] || [];
        DOM.modalTeamFilter.innerHTML = "";
        if (!DOM.modalLeagueFilter.value) {
            DOM.modalTeamFilter.disabled = true;
            DOM.modalTeamFilter.append(new Option("리그를 먼저 선택", ""));
            return;
        }
        DOM.modalTeamFilter.disabled = false;
        DOM.modalTeamFilter.append(new Option("전체 팀", ""));
        teams.forEach(team => DOM.modalTeamFilter.append(new Option(team, team)));
        if (preferredTeam && teams.includes(preferredTeam)) {
            DOM.modalTeamFilter.value = preferredTeam;
        }
    }

    function rebuildCareerLeagueOptions() {
        const previousLeague = DOM.modalLeagueFilter.value;
        const previousTeam = DOM.modalTeamFilter.value;
        const leagueTeams = getCareerLeagueTeams();
        DOM.modalLeagueFilter.innerHTML = "";
        DOM.modalLeagueFilter.append(new Option("전체 리그", ""));
        Object.keys(leagueTeams).forEach(league => {
            DOM.modalLeagueFilter.append(new Option(league, league));
        });
        if (previousLeague && Object.hasOwn(leagueTeams, previousLeague)) {
            DOM.modalLeagueFilter.value = previousLeague;
        }
        rebuildCareerTeamOptions(previousTeam);
    }

    function updateSquadFilterCounts() {
        DOM.modalFilterForm.querySelectorAll("[data-squad-filter-group]").forEach(group => {
            const checkboxCount = group.querySelectorAll('input[type="checkbox"]:checked').length;
            const selectedCount = Array.from(group.querySelectorAll("select")).filter(select => select.value).length;
            const count = group.querySelector("[data-filter-count]");
            if (count) count.textContent = String(checkboxCount + selectedCount);
        });
        const activeFilterCount = Array.from(DOM.modalFilterForm.elements).filter(field => {
            if (!field.name || ["sort", "q"].includes(field.name) || field.disabled) return false;
            if (field.name === "price_enhance") return Number(field.value) > 0;
            if (field.type === "checkbox" || field.type === "radio") return field.checked;
            return Boolean(String(field.value || "").trim());
        }).length;
        if (DOM.modalFilterStatus) {
            DOM.modalFilterStatus.textContent = activeFilterCount
                ? `선택한 필터 ${activeFilterCount}개`
                : "";
        }
        const conditionCount = document.getElementById("squad-search-condition-count");
        const count = [...DOM.modalFilterForm.querySelectorAll(".squad-search-filters input, .squad-search-filters select")].filter(field =>
            field.name && !field.disabled && (field.name === "price_enhance" ? Number(field.value) > 0 : (field.type === "checkbox" ? field.checked : String(field.value || "").trim()))
        ).length;
        if (conditionCount) conditionCount.textContent = count ? `${count}개` : "";
    }

    function syncSquadExclusiveFilters() {
        const skillInputs = Array.from(DOM.modalFilterForm.querySelectorAll('input[name="skill_or_boost"]'));
        const raisedInputs = Array.from(DOM.modalFilterForm.querySelectorAll('input[name="raised_stat"]'));
        const hasSkill = skillInputs.some(input => input.checked);
        const hasRaised = raisedInputs.some(input => input.checked);

            input.disabled = hasRaised && !input.checked;
            input.closest("label")?.classList.toggle("is-disabled", input.disabled);

        raisedInputs.forEach(input => {

            input.closest("label")?.classList.toggle("is-disabled", input.disabled);
        });
    }

    function formatPrice(price, emptyText = "가격 없음") {
        const numericPrice = Number(price);
        return Number.isFinite(numericPrice) && numericPrice > 0
            ? `${numericPrice.toLocaleString()} ${PRICE_UNIT}`
            : emptyText;
    }

    function getOptimizedPlayerImage(player, kind, width = 256) {
        if (!player || !["card", "faceon"].includes(kind)) return "";
        const thumbKey = width <= 128
            ? (kind === "card" ? "bimageThumbSmall" : "pimageThumbSmall")
            : (kind === "card" ? "bimageThumb" : "pimageThumb");
        const originalKey = kind === "card" ? "bimage" : "pimage";
        if (player[thumbKey]) return player[thumbKey];
        const original = player[originalKey] || "";
        const cid = Number(player.cid);
        if (cid && original.includes(`/static/${kind}/`)) {
            return `/media/player/${PLAYER_THUMBNAIL_VERSION}/${kind}/${cid}-${width}.webp`;
        }
        return original || (cid ? `/media/player/${PLAYER_THUMBNAIL_VERSION}/${kind}/${cid}-${width}.webp` : "");
    }

    function normalizeMarketPrices(raw) {
        const prices = {};
        if (!raw || typeof raw !== "object" || Array.isArray(raw)) return prices;
        for (let level = 0; level <= MAX_ENHANCE_LEVEL; level += 1) {
            const value = Number(raw[level]);
            if (Number.isFinite(value) && value > 0) prices[level] = value;
        }
        return prices;
    }

    function getPlayerMarketPrice(player, enhance = 0) {
        if (!player || typeof player !== "object") return 0;
        const level = Math.max(0, Math.min(MAX_ENHANCE_LEVEL, Math.trunc(Number(enhance) || 0)));
        // An API snapshot is authoritative, including an empty/missing level.
        // Never substitute a different evolution level's market price.
        if (player.priceByEnhance && typeof player.priceByEnhance === "object") {
            const value = Number(player.priceByEnhance[level]);
            return Number.isFinite(value) && value > 0 ? value : 0;
        }
        const exactKey = `n8Price${level}`;
        if (Object.prototype.hasOwnProperty.call(player, exactKey)) {
            const value = Number(player[exactKey]);
            return Number.isFinite(value) && value > 0 ? value : 0;
        }
        const numericKeys = level === 0 ? ["n8Price", "price"] : [];
        for (const key of numericKeys) {
            const value = Number(player[key]);
            if (Number.isFinite(value) && value > 0) return value;
        }
        return 0;
    }

    function getSquadMarketValue(squad, enhanced = false) {
        const summary = { total: 0, playerCount: 0, missingCount: 0 };
        Object.values(squad).forEach(slot => {
            const player = slot?.playerData;
            if (!player) return;
            const level = enhanced ? FimoSquad.normalizeConfig(player.squadConfig).enhance : 0;
            const price = getPlayerMarketPrice(player, level);
            summary.playerCount += 1;
            if (price) summary.total += price;
            else summary.missingCount += 1;
        });
        return summary;
    }

    function formatSquadMarketValue(summary, includeMissing = false) {
        const value = formatPrice(summary.total, summary.playerCount ? "시세 없음" : `0 ${PRICE_UNIT}`);
        return includeMissing && summary.total && summary.missingCount
            ? `${value} · ${summary.missingCount}명 시세 없음` : value;
    }

    async function hydratePlayerMarketPrices(players, rerender, options = {}) {
        if (!Array.isArray(players) || !players.length) {
            return { total: 0, resolvedCount: 0, liveCount: 0 };
        }
        const cids = [...new Set(players.map(player => Number(player.cid)).filter(Number.isFinite))];
        if (!cids.length) return { total: 0, resolvedCount: 0, liveCount: 0 };
        try {
            const response = await fetch(
                `/api/player_prices?cids=${encodeURIComponent(cids.join(","))}`,
                options.signal ? { signal: options.signal } : undefined,
            );
            if (!response.ok) return { total: cids.length, resolvedCount: 0, liveCount: 0 };
            const payload = await response.json();
            if (options.isCurrent && !options.isCurrent()) {
                return { total: cids.length, resolvedCount: 0, liveCount: 0 };
            }
            const prices = payload?.prices || {};
            const artwork = payload?.artwork || {};
            const artworkKeys = [
                "pimage", "pimageThumb", "pimageThumbSmall",
                "bimage", "bimageThumb", "bimageThumbSmall", "cardArt",
            ];
            let resolvedCount = 0;
            let liveCount = 0;
            players.forEach(player => {
                const livePrice = prices[String(player.cid)];
                if (!livePrice) return;
                const canonicalArtwork = artwork[String(player.cid)] || {};
                const numericPrice = Number(livePrice.price);
                if (Number.isFinite(numericPrice) && numericPrice > 0) {
                    player.price = numericPrice;
                    resolvedCount += 1;
                }
                if (livePrice.priceByEnhance && typeof livePrice.priceByEnhance === "object") {
                    player.priceByEnhance = normalizeMarketPrices(livePrice.priceByEnhance);
                }
                player.priceSource = livePrice.source;
                player.priceCheckedAt = livePrice.checked_at;
                artworkKeys.forEach(key => {
                    if (canonicalArtwork[key]) player[key] = canonicalArtwork[key];
                    else delete player[key];
                });
                if (livePrice.source === "live") liveCount += 1;
            });
            if (typeof rerender === "function" && (!options.isCurrent || options.isCurrent())) {
                rerender(players);
            }
            return { total: cids.length, resolvedCount, liveCount };
        } catch (error) {
            if (error?.name === "AbortError") {
                return { total: cids.length, resolvedCount: 0, liveCount: 0 };
            }
            console.debug("실시간 가격 조회 실패, 로컬 가격을 유지합니다.", error);
            return { total: cids.length, resolvedCount: 0, liveCount: 0 };
        }
    }

    function getSearchPriceEnhance() {
        return Math.max(0, Math.min(MAX_ENHANCE_LEVEL,
            Math.trunc(Number(DOM.modalFilterForm.elements.price_enhance?.value) || 0)));
    }

    function getSearchPriceBounds() {
        const parseValue = name => {
            const raw = DOM.modalFilterForm.elements[name]?.value;
            const value = Number(String(raw || "").replace(/,/g, ""));
            return Number.isFinite(value) && value >= 0 && String(raw || "").trim() ? value : null;
        };
        let minPrice = parseValue("min_price");
        let maxPrice = parseValue("max_price");
        if (minPrice !== null && maxPrice !== null && minPrice > maxPrice) {
            [minPrice, maxPrice] = [maxPrice, minPrice];
        }
        return { minPrice, maxPrice };
    }

    function prepareLatestPriceSearchResults(players, sortBy = DOM.modalSortFilter?.value || "recommend") {
        const priceEnhance = getSearchPriceEnhance();
        const { minPrice, maxPrice } = getSearchPriceBounds();
        const prepared = players.filter(player => {
            if (minPrice === null && maxPrice === null) return true;
            const price = getPlayerMarketPrice(player, priceEnhance);
            if (!price) return false;
            if (minPrice !== null && price < minPrice) return false;
            if (maxPrice !== null && price > maxPrice) return false;
            return true;
        });

        const byName = (left, right) => String(left.playerKor || "").localeCompare(
            String(right.playerKor || ""),
            "ko",
        );
        if (sortBy === "ovr_desc") {
            prepared.sort((left, right) => Number(right.ovr || 0) - Number(left.ovr || 0) || byName(left, right));
        } else if (sortBy === "ovr_asc") {
            prepared.sort((left, right) => Number(left.ovr || 0) - Number(right.ovr || 0) || byName(left, right));
        } else if (sortBy === "price_desc" || sortBy === "price_asc") {
            prepared.sort((left, right) => {
                const leftPrice = getPlayerMarketPrice(left, priceEnhance);
                const rightPrice = getPlayerMarketPrice(right, priceEnhance);
                if (!leftPrice && rightPrice) return 1;
                if (leftPrice && !rightPrice) return -1;
                const priceDiff = sortBy === "price_asc" ? leftPrice - rightPrice : rightPrice - leftPrice;
                return priceDiff || Number(right.ovr || 0) - Number(left.ovr || 0) || byName(left, right);
            });
        } else if (sortBy === "name") {
            prepared.sort(byName);
        }
        return prepared;
    }

    async function refreshSquadMarketPrices() {
        const playersByCid = new Map();
        [...Object.values(G.squad), ...Object.values(G.bench)].forEach(slot => {
            const player = slot?.playerData;
            const cid = Number(player?.cid);
            if (!player || !Number.isFinite(cid)) return;
            if (!playersByCid.has(cid)) playersByCid.set(cid, []);
            playersByCid.get(cid).push(player);
        });
        if (!playersByCid.size) {
            if (DOM.squadPriceStatus) DOM.squadPriceStatus.textContent = "최신 시세 자동 반영";
            return;
        }

        if (G.squadPriceRequestController) G.squadPriceRequestController.abort();
        const requestController = new AbortController();
        G.squadPriceRequestController = requestController;
        if (DOM.squadPriceStatus) DOM.squadPriceStatus.textContent = "최신 시세 확인 중…";
        const representatives = Array.from(playersByCid.values(), group => group[0]);
        const result = await hydratePlayerMarketPrices(representatives, null, {
            signal: requestController.signal,
            isCurrent: () => G.squadPriceRequestController === requestController,
        });
        if (G.squadPriceRequestController !== requestController) return;

        representatives.forEach(representative => {
            playersByCid.get(Number(representative.cid))?.forEach(player => {
                player.price = representative.price;
                player.priceSource = representative.priceSource;
                player.priceCheckedAt = representative.priceCheckedAt;
                if (representative.priceByEnhance) player.priceByEnhance = { ...representative.priceByEnhance };
                [
                    "pimage", "pimageThumb", "pimageThumbSmall",
                    "bimage", "bimageThumb", "bimageThumbSmall", "cardArt",
                ].forEach(key => {
                    if (representative[key]) player[key] = representative[key];
                    else delete player[key];
                });
            });
        });
        updateAll();
        persistState("최신 시세 반영됨");
        if (DOM.squadPriceStatus) {
            DOM.squadPriceStatus.textContent = result.liveCount === result.total
                ? "최신 시세 반영됨"
                : `최신 시세 ${result.liveCount}/${result.total}명 반영`;
        }
        G.squadPriceRequestController = null;
    }

    function getPlayerSkillText(player) {
        if (player?.skillBoostName) {
            return player.skillBoostName;
        }
        function getSkillName(id) {
            const normalized = String(id || "").trim();
            if (!normalized) return "";
            if (SKILL_ID_NAME_MAP[normalized]) return SKILL_ID_NAME_MAP[normalized];
            if (/^260\d{2}$/.test(normalized)) {
                const converted = `261${normalized.slice(-3)}`;
                if (SKILL_ID_NAME_MAP[converted]) return SKILL_ID_NAME_MAP[converted];
            }
            return `스킬 ${normalized}`;
        }
        if (Array.isArray(player?.skillLabels) && player.skillLabels.length) {
            return player.skillLabels.join(", ");
        }
        if (Array.isArray(player?.skills) && player.skills.length) {
            return player.skills
                .map(skill => {
                    if (typeof skill === "string") return skill;
                    const id = String(skill?.id || "").trim();
                    if (!id) return "";
                    const level = skill?.level ?? skill?.lv;
                    const name = getSkillName(id);
                    return level === undefined || level === null || String(level).trim() === "" ? name : `${name} Lv.${level}`;
                })
                .filter(Boolean)
                .join(", ");
        }
        if (Array.isArray(player?.skillInfo) && player.skillInfo.length) {
            return player.skillInfo
                .map(skill => {
                    const id = String(skill?.id || "").trim();
                    if (!id) return "";
                    const level = skill?.lv ?? skill?.level;
                    const name = getSkillName(id);
                    return level === undefined || level === null || String(level).trim() === "" ? name : `${name} Lv.${level}`;
                })
                .filter(Boolean)
                .join(", ");
        }
        if (player?.skillStyleId) {
            return getSkillName(player.skillStyleId);
        }
        return "";
    }

    function renderResults(players) {
        if (!players.length) {
            DOM.modalResultList.innerHTML = `<div class="modal-empty">검색 결과가 없습니다.</div>`;
            return;
        }

        const scrollTop = DOM.modalResultList.scrollTop;
        const resultLabel = players.length >= 60 ? "상위 60명" : `${players.length}명`;
        DOM.modalResultList.innerHTML = `
            <div class="modal-results-summary">${resultLabel}</div>
            ${players.map(buildPlayerSearchResultItem).join("")}
        `;

        DOM.modalResultList.scrollTop = scrollTop;
        DOM.modalResultList.querySelectorAll(".modal-result-item").forEach(button => {
            button.addEventListener("click", () => {
                const cid = Number(button.dataset.cid);
                const player = players.find(item => Number(item.cid) === cid);
                if (!player || !G.currentSlotName) return;
                const slotState = getSlotState(G.currentSlotName);
                if (!slotState) return;
                slotState.playerData = player;
                FimoSquad.assignDefaults(player);
                updateAll();
                persistState("선수 배치됨");
                const starterCount = getStarterCount();
                trackAnalytics("squad_player_add", {
                    content_id: player.cid,
                    slot_name: getSlotLabel(G.currentSlotName),
                    starter_count: starterCount,
                    formation: G.currentFormation,
                });
                if (starterCount === Object.keys(G.squad).length) {
                    trackAnalytics("squad_complete", {
                        starter_count: starterCount,
                        formation: G.currentFormation,
                    }, { onceKey: "squad_complete" });
                }
                closeSearchModal();
            });
        });
    }

    function renderCompareSearchResults(players) {
        if (!G.compareSourcePlayer) return;
        const sourceCid = Number(G.compareSourcePlayer.cid);
        const filteredPlayers = players.filter(player => Number(player.cid) !== sourceCid);
        if (!filteredPlayers.length) {
            DOM.compareResultList.innerHTML = `<div class="modal-empty">비교할 선수를 찾지 못했습니다. 다른 검색어를 입력해 보세요.</div>`;
            return;
        }
        DOM.compareResultList.innerHTML = filteredPlayers.map(buildPlayerSearchResultItem).join("");

        DOM.compareResultList.querySelectorAll(".modal-result-item").forEach(button => {
            button.addEventListener("click", async () => {
                const targetCid = Number(button.dataset.cid);
                const targetPlayer = filteredPlayers.find(player => Number(player.cid) === targetCid);
                await openComparePanel(targetCid, targetPlayer);
            });
        });
    }

    async function runCompareSearch() {
        if (!G.compareSourcePlayer) return;
        const q = DOM.compareSearchInput.value.trim();
        const classFilter = DOM.compareClassFilter.value.trim();
        DOM.compareResultList.innerHTML = `<div class="modal-empty">선수 목록을 불러오는 중입니다.</div>`;

        const url = new URL("/api/squad_players", window.location.origin);
        url.searchParams.set("limit", "60");
        if (q) url.searchParams.set("q", q);
        if (classFilter) url.searchParams.set("class", classFilter);
        const slot = getCompareSlotSearchPosition(G.compareSourceSlotName);
        if (slot && !q && !classFilter) url.searchParams.set("slot", slot);

        if (G.compareSearchRequestController) {
            G.compareSearchRequestController.abort();
        }
        const requestController = new AbortController();
        G.compareSearchRequestController = requestController;

        try {
            const response = await fetch(url.toString(), { signal: requestController.signal });
            const players = await response.json();
            if (G.compareSearchRequestController !== requestController) return;
            const playerList = Array.isArray(players) ? players : [];
            renderCompareSearchResults(playerList);
            await hydratePlayerMarketPrices(playerList, renderCompareSearchResults, {
                signal: requestController.signal,
                isCurrent: () => G.compareSearchRequestController === requestController,
            });
        } catch (error) {
            if (error?.name === "AbortError") return;
            console.error(error);
            DOM.compareResultList.innerHTML = `<div class="modal-empty">검색 중 오류가 발생했습니다.</div>`;
        } finally {
            if (G.compareSearchRequestController === requestController) {
                G.compareSearchRequestController = null;
            }
        }
    }

    function runManualCompareSearch() {
        DOM.compareResultList.classList.remove("hidden");
        if (isMobileLayout()) {
            if (typeof document.activeElement?.blur === "function") {
                document.activeElement.blur();
            }
            setMobileCompareResultsMode(true);
        }
        runCompareSearch();
    }

    function renderComparePanel(sourcePlayer, targetPlayer, statGroups) {
        const toNumber = value => (typeof value === "number" ? value : Number(value));
        const renderValuePair = (leftRaw, rightRaw) => {
            const leftNum = toNumber(leftRaw);
            const rightNum = toNumber(rightRaw);
            const bothNumeric = Number.isFinite(leftNum) && Number.isFinite(rightNum);
            const leftHigher = bothNumeric && leftNum >= rightNum;
            const rightHigher = bothNumeric && rightNum >= leftNum;
            const leftDiff = bothNumeric && leftNum > rightNum ? `▲${leftNum - rightNum}` : "";
            const rightDiff = bothNumeric && rightNum > leftNum ? `▲${rightNum - leftNum}` : "";
            return {
                leftMain: leftRaw ?? "-",
                rightMain: rightRaw ?? "-",
                leftHigher,
                rightHigher,
                leftDiff,
                rightDiff,
            };
        };

        const groupBlocks = Object.entries(statGroups || {}).map(([groupName, stats]) => {
            const rows = Object.entries(stats || {}).map(([code, label]) => {
                const v = renderValuePair(sourcePlayer[code], targetPlayer[code]);
                return `
                    <div class="compare-row">
                        <div class="compare-stat-value right">
                            ${v.leftDiff ? `<span class="compare-diff">${v.leftDiff}</span>` : ""}
                            <span class="compare-stat-main ${v.leftHigher ? "higher" : ""}">${v.leftMain}</span>
                        </div>
                        <div class="compare-stat-name">${label}</div>
                        <div class="compare-stat-value">
                            <span class="compare-stat-main ${v.rightHigher ? "higher" : ""}">${v.rightMain}</span>
                            ${v.rightDiff ? `<span class="compare-diff">${v.rightDiff}</span>` : ""}
                        </div>
                    </div>
                `;
            }).join("");
            return `<section class="compare-group"><div class="compare-group-title">${groupName}</div>${rows}</section>`;
        }).join("");

        DOM.comparePanelBody.innerHTML = `
            <div class="compare-actions">
                <button class="compare-replace-btn" id="compare-replace-btn" type="button">선수 교체하기</button>
            </div>
            <div class="compare-top">
                <article class="compare-player">
                    <div class="compare-thumb" data-fimo-card-cid="${sourcePlayer.cid}" data-fimo-card-ovr="${sourcePlayer.ovr}" style="background-image:url('${getOptimizedPlayerImage(sourcePlayer, "card", 128)}')">
                        <img src="${getOptimizedPlayerImage(sourcePlayer, "faceon", 128)}" alt="${sourcePlayer.playerKor || ""}" loading="lazy">
                    </div>
                    <div>
                        <div class="compare-name">${sourcePlayer.playerKor || "-"}</div>
                        <div class="compare-sub">${sourcePlayer.className || "-"} · ${sourcePlayer.position || "-"}</div>
                        <div class="compare-sub">OVR ${sourcePlayer.ovr || 0} · ${sourcePlayer.team || "-"}</div>
                        <div class="compare-sub">${sourcePlayer.squadGrowthLabel || "0진화 · 훈련 0단계"}</div>
                    </div>
                </article>
                <article class="compare-player">
                    <div class="compare-thumb" data-fimo-card-cid="${targetPlayer.cid}" data-fimo-card-ovr="${targetPlayer.ovr}" style="background-image:url('${getOptimizedPlayerImage(targetPlayer, "card", 128)}')">
                        <img src="${getOptimizedPlayerImage(targetPlayer, "faceon", 128)}" alt="${targetPlayer.playerKor || ""}" loading="lazy">
                    </div>
                    <div>
                        <div class="compare-name">${targetPlayer.playerKor || "-"}</div>
                        <div class="compare-sub">${targetPlayer.className || "-"} · ${targetPlayer.position || "-"}</div>
                        <div class="compare-sub">OVR ${targetPlayer.ovr || 0} · ${targetPlayer.team || "-"}</div>
                        <div class="compare-sub">${targetPlayer.squadGrowthLabel || "0진화 · 훈련 0단계"}</div>
                    </div>
                </article>
            </div>
            ${groupBlocks}
        `;

        const replaceBtn = document.getElementById("compare-replace-btn");
        if (replaceBtn) {
            replaceBtn.addEventListener("click", replaceComparedPlayer);
        }
    }

    async function fetchComparePlayer(cid) {
        const response = await fetch(`/api/player_compare?cid=${encodeURIComponent(cid)}`);
        if (!response.ok) {
            throw new Error("Failed to fetch compare player");
        }
        return response.json();
    }

    async function openComparePanel(targetCid, targetSeedPlayer = null) {
        if (!G.compareSourcePlayer) return;
        try {
            DOM.compareResultList.innerHTML = `<div class="modal-empty">비교 데이터를 불러오는 중입니다.</div>`;
            const [sourcePayload, targetPayload] = await Promise.all([
                fetchComparePlayer(G.compareSourcePlayer.cid),
                fetchComparePlayer(targetCid),
            ]);
            G.compareTargetPlayer = {
                ...(targetSeedPlayer || {}),
                ...(targetPayload.player || {}),
            };
            const sourceConfig = FimoSquad.normalizeConfig(G.compareSourcePlayer.squadConfig);
            G.compareTargetPlayer.squadConfig = { ...sourceConfig, playstyles: {} };
            renderComparePanel(
                FimoSquad.adjustedPlayer(sourcePayload.player, G.compareSourcePlayer),
                FimoSquad.adjustedPlayer(targetPayload.player, G.compareTargetPlayer),
                sourcePayload.stat_groups,
            );
            closeCompareSearchModal();
            document.body.classList.add("modal-open");
            DOM.comparePanel.classList.add("open");
        } catch (error) {
            console.error(error);
            DOM.compareResultList.innerHTML = `<div class="modal-empty">비교 데이터를 불러오지 못했습니다.</div>`;
        }
    }

    function replaceComparedPlayer() {
        if (!G.compareSourceSlotName || !G.compareTargetPlayer) return;
        const slotState = getSlotState(G.compareSourceSlotName);
        if (!slotState) return;
        slotState.playerData = G.compareTargetPlayer;
        G.selectedSlotName = G.compareSourceSlotName;
        G.compareSourcePlayer = G.compareTargetPlayer;
        updateAll();
        persistState("비교 선수로 교체됨");
        closeComparePanel();
    }

    async function runSearch() {
        const slot = getCurrentSlotText();
        DOM.modalResultList.innerHTML = `<div class="modal-empty">선수 목록을 불러오는 중입니다.</div>`;

        const url = new URL("/api/squad_players", window.location.origin);
        const selectedSort = DOM.modalSortFilter?.value || "recommend";
        const { minPrice, maxPrice } = getSearchPriceBounds();
        const needsLatestPriceProcessing = minPrice !== null
            || maxPrice !== null
            || selectedSort === "price_asc"
            || selectedSort === "price_desc";
        url.searchParams.set("limit", "60");
        const formData = new FormData(DOM.modalFilterForm);
        // Slot suggestions apply only to an unfiltered search. Explicit searches span every position.
        const hasSearchCriteria = [...formData].some(([key, value]) =>
            !["sort", "include_sub_position", "all_career"].includes(key) && (key === "price_enhance" ? Number(value) > 0 : String(value || "").trim())
        );
        if (slot && !hasSearchCriteria) url.searchParams.set("slot", slot);
        formData.forEach((value, key) => {
            const cleanValue = String(value || "").trim();
            if (cleanValue) url.searchParams.append(key, cleanValue);
        });
        // Apply the selected stage and price bounds before the server limits candidates to 60.

        if (G.searchRequestController) {
            G.searchRequestController.abort();
        }
        const requestController = new AbortController();
        G.searchRequestController = requestController;

        try {
            const response = await fetch(url.toString(), { signal: requestController.signal });
            const players = await response.json();
            if (G.searchRequestController !== requestController) return;
            const playerList = Array.isArray(players) ? players : [];
            if (needsLatestPriceProcessing) {
                DOM.modalResultList.innerHTML = `<div class="modal-empty">최신 시세를 확인하고 있습니다.</div>`;
            } else {
                renderResults(prepareLatestPriceSearchResults(playerList, selectedSort));
            }
            await hydratePlayerMarketPrices(playerList, null, {
                signal: requestController.signal,
                isCurrent: () => G.searchRequestController === requestController,
            });
            if (G.searchRequestController !== requestController) return;
            renderResults(prepareLatestPriceSearchResults(playerList, selectedSort));
        } catch (error) {
            if (error?.name === "AbortError") return;
            console.error(error);
            DOM.modalResultList.innerHTML = `<div class="modal-empty">검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>`;
        } finally {
            if (G.searchRequestController === requestController) {
                G.searchRequestController = null;
            }
        }
    }

    function scheduleSearch() {
        clearTimeout(G.searchTimer);
        G.searchTimer = setTimeout(runSearch, 400);
    }

    function renderSlot(name, slotEl) {
        if (!slotEl) return null;

        const player = getSlotPlayer(name);
        const cardBgEl = slotEl.querySelector(".card-background");
        const playerImgEl = slotEl.querySelector(".player-image");
        const ovrEl = slotEl.querySelector(".ovr");
        const positionEl = slotEl.querySelector(".pos-text");
        const nameEl = slotEl.querySelector(".player-name-bottom");
        const detailBtn = slotEl.querySelector(".detail-btn");

        if (player) {
            slotEl.classList.add("filled");
            slotEl.draggable = true;
            const cardImage = getOptimizedPlayerImage(player, "card", 256);
            const faceImage = getOptimizedPlayerImage(player, "faceon", 256);
            cardBgEl.style.backgroundImage = cardImage ? `url(${cardImage})` : "";
            playerImgEl.style.backgroundImage = faceImage ? `url(${faceImage})` : "";
            ovrEl.textContent = FimoSquad.ovr(player);
            positionEl.textContent = player.position || "";
            nameEl.textContent = player.playerKor || "";
            detailBtn.href = FimoSquad.detailUrl(player);
            FimoSquad.renderCard(player, slotEl);
            return player;
        }

        slotEl.classList.remove("filled");
        slotEl.draggable = false;
        cardBgEl.style.backgroundImage = "";
        playerImgEl.style.backgroundImage = "";
        ovrEl.textContent = "";
        positionEl.textContent = "";
        nameEl.textContent = "";
        detailBtn.removeAttribute("href");
        FimoSquad.renderCard(null, slotEl);
        return null;
    }

    function updateAll() {
        document.body.classList.remove("hide-card-meta");
        let totalStarterOvr = 0;
        let starterCount = 0;

        Object.keys(G.squad).forEach(name => {
            const player = renderSlot(name, document.getElementById(`pos-${name}`));
            if (!player) return;
            starterCount += 1;
            totalStarterOvr += FimoSquad.ovr(player);
        });

        if (DOM.teamOvr) {
            DOM.teamOvr.textContent = starterCount ? Math.round(totalStarterOvr / starterCount) : 0;
        }
        const baseValue = getSquadMarketValue(G.squad);
        const enhancedValue = getSquadMarketValue(G.squad, true);
        DOM.teamValue.textContent = formatSquadMarketValue(baseValue, true);
        DOM.teamEnhancedValue.textContent = formatSquadMarketValue(enhancedValue);
        DOM.teamValueMissing.hidden = !enhancedValue.missingCount;
        DOM.teamValueMissing.textContent = enhancedValue.total
            ? `${enhancedValue.missingCount}명 시세 없음 · 부분 합계`
            : `${enhancedValue.missingCount}명 시세 없음`;
        DOM.mobileEnhancedTeamValue.textContent = formatSquadMarketValue(enhancedValue, true);
        DOM.mobileBaseTeamValue.textContent = formatSquadMarketValue(baseValue, true);
        DOM.filledCount.textContent = `${starterCount} / ${Object.keys(G.squad).length}`;
        FimoSquad.updateSummary();
        updateSelectedSlotCopy();
        updateSelectedPlayerActionButtons();
        selectSlot(G.selectedSlotName);
        if (document.body.classList.contains("mobile-layout") && !document.body.classList.contains("mobile-landscape")) {
            requestAnimationFrame(() => {
                updateMobileFieldHeight();
                layoutSquadSlots(formationData[G.currentFormation]);
            });
        }
    }

    function handleDragStart(event) {
        const target = event.target.closest(".position");
        if (!target || !target.classList.contains("filled")) return;
        G.draggedSlotName = target.dataset.name;
        event.dataTransfer.effectAllowed = "move";
        setTimeout(() => target.classList.add("dragging"), 0);
    }

    function handleDragEnd(event) {
        const target = event.target.closest(".position");
        if (target) target.classList.remove("dragging");
        G.draggedSlotName = null;
    }

    function handleDragOver(event) {
        event.preventDefault();
    }

    function handleDrop(event) {
        event.preventDefault();
        const target = event.target.closest(".position");
        if (!target) return;
        const targetSlotName = target.dataset.name;
        if (!G.draggedSlotName || !targetSlotName || G.draggedSlotName === targetSlotName) return;

        const sourceSlotState = getSlotState(G.draggedSlotName);
        const targetSlotState = getSlotState(targetSlotName);
        if (!sourceSlotState || !targetSlotState) return;

        const sourcePlayerData = sourceSlotState.playerData;
        sourceSlotState.playerData = targetSlotState.playerData;
        targetSlotState.playerData = sourcePlayerData;
        G.selectedSlotName = targetSlotName;
        updateAll();
        persistState("선수 위치 변경됨");
    }

    async function exportImage() {
        if (DOM.saveBtn.disabled) return;
        const originalLabel = DOM.saveBtn.textContent;
        DOM.saveBtn.disabled = true;
        DOM.saveBtn.textContent = "이미지 준비 중";
        try {
            await refreshSquadMarketPrices();
            const formation = G.currentFormation;
            const squad = JSON.parse(JSON.stringify(G.squad));
            const positions = formationData[formation];
            const players = Object.values(squad).map(slot => slot.playerData).filter(Boolean);
            const blob = await FimoSquadExport.render({
                formation, squad, positions,
                layout: calculateSquadLayout(positions, { width: 1200, height: 920 }),
                artwork: player => ({
                    ...FimoSquad.cardArtwork(player),
                    card: getOptimizedPlayerImage(player, "card", 512),
                    face: getOptimizedPlayerImage(player, "faceon", 512),
                }),
                averageOvr: players.length ? Math.round(players.reduce((sum, player) => sum + FimoSquad.ovr(player), 0) / players.length) : 0,
                priceText: `진화 기준 구단 가치 ${formatSquadMarketValue(getSquadMarketValue(squad, true), true)}`,
            });
            const imageSource = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("PNG 파일을 읽지 못했습니다."));
                reader.readAsDataURL(blob);
            });
            const link = document.getElementById("squad-export-download");
            link.href = imageSource;
            link.download = `피모북_스쿼드_${formation}.png`;
            document.getElementById("squad-export-image").src = imageSource;
            document.getElementById("squad-image-preview").showModal();
            trackAnalytics("squad_export", { starter_count: players.length, formation });
        } catch (error) {
            console.error(error);
            window.alert("선수 이미지를 불러오지 못했습니다. 다시 저장해 주세요.");
        } finally {
            DOM.saveBtn.disabled = false;
            DOM.saveBtn.textContent = originalLabel;
        }
    }

    function resetSquad() {
        if (!window.confirm("현재 스쿼드를 초기화하시겠습니까?")) return;
        Object.keys(G.squad).forEach(name => {
            G.squad[name] = { playerData: null };
        });
        persistState("스쿼드 초기화됨");
        updateAll();
    }

    function openSearchForCurrentSlot() {
        const nextSlot = G.selectedSlotName
            || Object.keys(G.squad).find(name => !getSlotPlayer(name))
            || Object.keys(G.squad)[0];
        if (!nextSlot) return;
        openSearchModal(nextSlot);
    }

    function handleViewportResize() {
        clearTimeout(G.resizeTimer);
        G.resizeTimer = setTimeout(() => {
            syncLayoutMode();
            updateMobileFieldHeight();
            changeFormation(G.currentFormation, { preserveExisting: true });
        }, 120);
    }

    function setupEventListeners() {
        DOM.formationSelect.addEventListener("change", event => changeFormation(event.target.value));
        if (DOM.mobileOverlayFormationSelect) {
            DOM.mobileOverlayFormationSelect.addEventListener("change", event => changeFormation(event.target.value));
        }
        DOM.modalCloseBtn.addEventListener("click", closeSearchModal);
        DOM.mobileSearchBackBtn.addEventListener("click", () => {
            setMobileSearchResultsMode(false);
            DOM.modalResultList.classList.add("hidden");
            DOM.modalSearchInput.focus();
        });
        DOM.modal.addEventListener("click", event => {
            if (event.target === DOM.modal) closeSearchModal();
        });
        DOM.compareSearchCloseBtn.addEventListener("click", closeCompareSearchModal);
        DOM.compareSearchModal.addEventListener("click", event => {
            if (event.target === DOM.compareSearchModal) closeCompareSearchModal();
        });
        DOM.compareMobileSearchBackBtn.addEventListener("click", () => {
            setMobileCompareResultsMode(false);
            DOM.compareResultList.classList.add("hidden");
            DOM.compareSearchInput.focus();
        });
        DOM.compareSearchInput.addEventListener("keydown", handleMobileCompareSearchSubmit);
        DOM.compareClassFilter.addEventListener("keydown", handleMobileCompareSearchSubmit);
        DOM.compareSearchSubmitBtn.addEventListener("click", runManualCompareSearch);
        DOM.comparePanelCloseBtn.addEventListener("click", closeComparePanel);
        DOM.comparePanel.addEventListener("click", event => {
            if (event.target === DOM.comparePanel) closeComparePanel();
        });
        document.addEventListener("pointerdown", event => {
            if (!isMobileLayout() || isOverlayOpen()) return;
            if (!event.target.closest("#squad-div")) return;
            if (event.target.closest(".position")) return;
            clearSlotSelection();
        });
        DOM.saveBtn.addEventListener("click", exportImage);
        DOM.resetBtn.addEventListener("click", resetSquad);
        DOM.openSearchBtn.addEventListener("click", openSearchForCurrentSlot);
        DOM.selectedDetailBtn.addEventListener("click", openSelectedPlayerDetail);
        DOM.selectedCompareBtn.addEventListener("click", openSelectedPlayerCompare);
        if (DOM.mobileOverlayResetBtn) {
            DOM.mobileOverlayResetBtn.addEventListener("click", resetSquad);
        }
        if (DOM.mobileOverlayDetailBtn) {
            DOM.mobileOverlayDetailBtn.addEventListener("click", openSelectedPlayerDetail);
        }
        if (DOM.mobileOverlayCompareBtn) {
            DOM.mobileOverlayCompareBtn.addEventListener("click", openSelectedPlayerCompare);
        }
        DOM.squadDiv.addEventListener("dragstart", handleDragStart);
        DOM.squadDiv.addEventListener("dragend", handleDragEnd);
        DOM.squadDiv.addEventListener("dragover", handleDragOver);
        DOM.squadDiv.addEventListener("drop", handleDrop);
        window.addEventListener("resize", handleViewportResize);
        window.addEventListener("orientationchange", handleViewportResize);
        window.addEventListener("keydown", event => {
            if (event.key === "Tab" && DOM.modal.classList.contains("open")) {
                const focusable = [...DOM.modal.querySelectorAll("button, input, select, summary")].filter(element =>
                    !element.disabled && element.getClientRects().length
                );
                const first = focusable[0], last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
                else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
            }
            if (event.key === "Escape") {
                closeSearchModal();
                closeCompareSearchModal();
                closeComparePanel();
            }
        });
    }

    init();
    </script>

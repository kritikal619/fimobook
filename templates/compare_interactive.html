<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선수 비교 | 피모북</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- 여기에 이전 답변의 CSS 코드가 그대로 들어갑니다 --- */
        /* 커스텀 폰트 */
        @font-face {
            font-family: 'FCOVR';
            src: url('{{ url_for('static', filename='fonts/FCOVR.otf') }}') format('opentype');
        }
        @font-face {
            font-family: 'FCName';
            src: url('{{ url_for('static', filename='fonts/NAME.ttf') }}') format('truetype');
        }
        @font-face {
            font-family: 'FCPosition';
            src: url('{{ url_for('static', filename='fonts/POSITION.otf') }}') format('opentype');
        }

        /* 기본 스타일 */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* 전체 페이지 스크롤 방지 */
        }
        body {
            background: linear-gradient(120deg, #eef4fb 0%, #fafdff 100%);
            font-family: 'Poppins', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 수직 중앙 정렬 */
            padding: 20px 15px;
            box-sizing: border-box;
        }
        .main-container {
            width: 100%;
            max-width: 1200px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 7px 30px rgba(33,51,87,0.12);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .brandbar {
            position: absolute; /* 절대 위치로 변경 */
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; gap: 12px;
            color: #1971c2; font-weight: 700; font-size: 20px;
        }
        .brandbar img { width: 28px; height: 28px; border-radius: 6px; }
        h1 {
            font-size: 26px; color: #23282d;
            margin-top: 0; margin-bottom: 10px;
            font-weight: 700; text-align: center;
        }
        .subtitle {
             color: #868e96; margin-top: 0; margin-bottom: 30px;
             font-size: 15px;
        }

        /* 선수 선택 영역 */
        .player-selection-area {
            display: flex; justify-content: center; gap: 20px;
            margin-bottom: 30px;
            width: 100%; flex-wrap: wrap;
        }
        .player-slot {
            border: 2px dashed #ccc; border-radius: 15px;
            width: 180px; height: 240px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden;
            background-color: #f8f9fa;
        }
        .player-slot:hover { border-color: #228be6; }
        .player-slot.selected {
            border: 2px solid #228be6;
            box-shadow: 0 8px 20px rgba(34,139,230,0.3);
        }
        .player-slot .add-btn { font-size: 50px; color: #ccc; }
        .player-slot.selected .add-btn { display: none; }
        
        /* 선수 카드 디자인 */
        .player-card-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; z-index: 1; }
        .player-card-player-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: 110% auto; background-position: center top; z-index: 2; }
        .player-card-ovr-pos { position: absolute; top: 25px; left: 15px; z-index: 3; color: white; text-shadow: 0 0 5px rgba(0,0,0,0.7); }
        .player-card-ovr { font-family: 'FCOVR', sans-serif; font-size: 28px; }
        .player-card-pos { font-family: 'FCPosition', sans-serif; font-size: 16px; }
        .player-card-name { position: absolute; bottom: 30px; left: 0; width: 100%; z-index: 3; color: white; text-align: center; font-family: 'FCName', sans-serif; font-size: 16px; }

        /* 검색 모달 */
        .search-modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .search-modal-content { background-color: #fefefe; margin: auto; padding: 20px; border: 1px solid #888; width: 90%; max-width: 500px; border-radius: 10px; position: relative; }
        .close-button { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .modal-search-controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .modal-search-controls input { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .modal-results-list { max-height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 5px; }
        .modal-result-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; gap: 10px;}
        .modal-result-item:hover { background-color: #f0f0f0; }
        .modal-result-item:last-child { border-bottom: none; }
        .modal-result-item img { width: 30px; height: 40px; object-fit: cover; }

        /* 비교하기 버튼 */
        #compare-button {
            padding: 12px 40px; font-size: 16px; font-weight: bold; cursor: pointer;
            border-radius: 8px; border: none; background-color: #adb5bd; color: white;
            transition: background-color 0.3s, transform 0.1s;
        }
        #compare-button:not(:disabled) { background-color: #228be6; }
        #compare-button:disabled { cursor: not-allowed; }
         #compare-button:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(34,139,230,0.3); }
        .main-page-button { margin-top: 15px; text-decoration: none; color: #868e96; font-size: 14px; }


        /* --- 모바일 최적화 (스크롤 방지) --- */
        @media (max-width: 768px) and (max-height: 800px) { /* 일반적인 모바일 세로 화면 */
            html, body {
                justify-content: center;
                overflow: hidden;
            }
            .main-container {
                padding: 20px;
                box-shadow: none;
                background: none;
            }
            .brandbar {
                top: 5vh; /* 뷰포트 높이 기준 */
                font-size: 18px;
            }
            h1 { font-size: 5.5vw; margin-bottom: 5px; } /* 뷰포트 너비 기준 */
            .subtitle { font-size: 3.5vw; margin-bottom: 5vh; }
            
            .player-selection-area {
                gap: 15px;
                margin-bottom: 5vh;
            }
            .player-slot {
                width: 38vw;  /* 너비를 뷰포트 기준으로 */
                height: 50vw; /* 높이를 뷰포트 기준으로 (비율 유지) */
            }

            #compare-button {
                padding: 12px 20px;
                font-size: 4vw;
                width: 80vw;
            }
            .main-page-button {
                margin-top: 2vh;
                font-size: 3.5vw;
            }
        }
    </style>
</head>
<body>
    <div class="brandbar">
        <img src="{{ url_for('static', filename='favicon.ico') }}" alt="로고">
        피모북
    </div>
    <div class="main-container">
        <h1>선수 비교</h1>
        <p class="subtitle">비교하고 싶은 선수 2명을 선택해주세요.</p>

        <div class="player-selection-area">
            {% for i in range(1, 3) %}
            <div class="player-slot" id="player-slot-{{ i }}" data-slot="{{ i }}">
                <span class="add-btn">+</span>
                <div class="player-card-overlay"></div>
                <div class="player-card-player-img"></div>
                <div class="player-card-ovr-pos">
                    <div class="player-card-ovr"></div>
                    <div class="player-card-pos"></div>
                </div>
                <div class="player-card-name"></div>
            </div>
            {% endfor %}
        </div>

        <button id="compare-button" disabled>비교하기</button>
        <a href="{{ url_for('index') }}" class="main-page-button">← 메인 페이지로</a>
    </div>

    <div id="search-modal" class="search-modal">
        <div class="search-modal-content">
            <span class="close-button">×</span>
            <h2>선수 검색</h2>
            <div class="modal-search-controls">
                <input type="text" id="modal-search-input" placeholder="선수 이름 검색..." autocomplete="off">
            </div>
            <div id="modal-autocomplete-list" class="modal-results-list"></div>
        </div>
    </div>


    <script>
        // JavaScript 내용은 이전 답변과 동일
        let selectedPlayers = [null, null]; 
        let currentSlot = 0;
        let playerDetailsCache = {};

        // ★★★ 이 부분부터 오류가 발생하지 않습니다 ★★★
        const playerSlots = document.querySelectorAll('.player-slot');
        const searchModal = document.getElementById('search-modal');
        const closeModalBtn = document.querySelector('.close-button');
        const modalSearchInput = document.getElementById('modal-search-input');
        const modalAutocompleteList = document.getElementById('modal-autocomplete-list');
        const compareButton = document.getElementById('compare-button');

        playerSlots.forEach(slot => {
            slot.addEventListener('click', function() {
                const slotNum = parseInt(this.dataset.slot);
                openSearchModal(slotNum);
            });
        });
        
        closeModalBtn.addEventListener('click', closeSearchModal);
        window.addEventListener('click', (event) => {
            if (event.target === searchModal) closeSearchModal();
        });

        modalSearchInput.addEventListener('input', fetchAutocompleteResults);

        function fetchAutocompleteResults() {
            const query = modalSearchInput.value.trim();
            if (query.length < 1) {
                modalAutocompleteList.innerHTML = '';
                return;
            }
            fetch(`/autocomplete?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    modalAutocompleteList.innerHTML = '';
                    if (data.length === 0) {
                        modalAutocompleteList.innerHTML = '<div style="padding: 10px; text-align: center; color: #888;">검색 결과 없음</div>';
                        return;
                    }
                    data.forEach(player => {
                        const item = document.createElement('div');
                        item.classList.add('modal-result-item');
                        item.innerHTML = `
                            <img src="${player.pimage}" alt="${player.playerKor}">
                            <span>${player.playerKor} (${player.className})</span>
                        `;
                        item.addEventListener('click', () => selectPlayer(player));
                        modalAutocompleteList.appendChild(item);
                    });
                })
                .catch(error => console.error('Autocomplete error:', error));
        }

        function openSearchModal(slotNum) {
            currentSlot = slotNum;
            searchModal.style.display = 'flex';
            modalSearchInput.value = ''; // 오류 발생 지점
            modalAutocompleteList.innerHTML = '';
            modalSearchInput.focus();
        }

        function closeSearchModal() {
            searchModal.style.display = 'none';
        }

        function selectPlayer(player) {
            playerDetailsCache[player.cid] = player;
            selectedPlayers[currentSlot - 1] = player.cid;
            updatePlayerSlotUI(currentSlot, player);
            closeSearchModal();
            checkAndToggleButton();
        }

        function updatePlayerSlotUI(slotNum, player) {
            const slot = document.getElementById(`player-slot-${slotNum}`);
            slot.classList.add('selected');
            slot.querySelector('.add-btn').style.display = 'none';
            
            slot.querySelector('.player-card-overlay').style.backgroundImage = `url('${player.bimage}')`;
            slot.querySelector('.player-card-player-img').style.backgroundImage = `url('${player.pimage}')`;
            slot.querySelector('.player-card-ovr').textContent = player.ovr;
            slot.querySelector('.player-card-pos').textContent = player.position;
            slot.querySelector('.player-card-name').textContent = player.playerKor;
        }

        function checkAndToggleButton() {
            const cidsToCompare = selectedPlayers.filter(cid => cid !== null);
            if (cidsToCompare.length === 2) {
                compareButton.disabled = false;
            } else {
                compareButton.disabled = true;
            }
        }

        compareButton.addEventListener('click', () => {
            const cidsToCompare = selectedPlayers.filter(cid => cid !== null);
            if (cidsToCompare.length === 2) {
                window.location.href = `/compare_players/${cidsToCompare.join(',')}`;
            }
        });
    </script>
</body>
</html>

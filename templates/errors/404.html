<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,follow">
    <title>404 - 페이지를 찾을 수 없습니다 | 피모북</title>
    <style>
        :root {
            --e-bg: #f6f7f9;
            --e-text: #1f2933;
            --e-muted: #616e7c;
            --e-line: #d9dee5;
            --e-accent: #1971c2;
            --e-accent-text: #fff;
        }

        html[data-theme="dark"] {
            --e-bg: #0f1623;
            --e-text: #e5e7eb;
            --e-muted: #9aa8ba;
            --e-line: #334155;
            --e-accent: #4dabf7;
            --e-accent-text: #0b1220;
        }

        * { box-sizing: border-box; }

        html[data-theme] body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--e-bg);
            color: var(--e-text);
            font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        .not-found {
            width: 100%;
            max-width: 420px;
        }

        .not-found-brand {
            display: inline-block;
            margin-bottom: 28px;
            color: var(--e-muted);
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
        }

        .not-found-code {
            margin: 0 0 6px;
            color: var(--e-muted);
            font-size: 14px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .not-found h1 {
            margin: 0 0 10px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .not-found-message {
            margin: 0 0 28px;
            color: var(--e-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .not-found-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .not-found-actions a,
        .not-found-actions button {
            min-height: 44px;
            padding: 0 20px;
            border: 1px solid var(--e-line);
            border-radius: 6px;
            background: transparent;
            color: var(--e-text);
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            line-height: 42px;
            text-decoration: none;
            cursor: pointer;
        }

        .not-found-actions .is-primary {
            border-color: var(--e-accent);
            background: var(--e-accent);
            color: var(--e-accent-text);
        }

        .not-found a:focus-visible,
        .not-found button:focus-visible {
            outline: 2px solid var(--e-accent);
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            .not-found-actions a,
            .not-found-actions button { flex: 1 1 100%; text-align: center; }
        }
    </style>
    {% include "_theme_head.html" %}
</head>
<body>
    <main class="not-found">
        <a class="not-found-brand" href="{{ url_for('index') }}">피모북</a>
        <p class="not-found-code">404</p>
        <h1>페이지를 찾을 수 없습니다</h1>
        <p class="not-found-message">주소가 바뀌었거나 없는 페이지입니다.</p>
        <div class="not-found-actions">
            <a class="is-primary" href="{{ url_for('index') }}">홈으로</a>
            <button type="button" onclick="history.length > 1 ? history.back() : location.assign('{{ url_for('index') }}')">이전 페이지</button>
        </div>
    </main>
</body>
</html>

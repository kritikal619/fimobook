<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <title>사이트 통계 | 피모북</title>
  <style>
    body {
      background: linear-gradient(120deg, #eef4fb 0%, #fafdff 100%);
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      box-sizing: border-box;
    }
    .stats-container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 7px 30px rgba(33,51,87,0.12);
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      text-align: center;
    }
    .stats-title {
      font-size: 24px;
      color: #23282d;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .stats-label {
      font-size: 16px;
      color: #69849c;
      margin-bottom: 20px;
    }
    .stats-number {
      font-size: 48px;
      color: #1971c2;
      font-weight: 700;
      margin-bottom: 30px;
    }
    .back-button {
      display: inline-block;
      padding: 12px 30px;
      background: #e0e6ed;
      color: #4a6c8e;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.23s;
    }
    .back-button:hover {
      background: #c3d2e1;
    }
  </style>
  {% include "_theme_head.html" %}
</head>
<body>
  <div class="stats-container">
    <h2 class="stats-title">사이트 통계</h2>
    <p class="stats-label">전체 누적 방문 횟수</p>
    <div class="stats-number">
      {{ "{:,}".format(visitor_count) }}
    </div>
    <a href="{{ url_for('index') }}" class="back-button">돌아가기</a>
  </div>
  {% include "_site_footer.html" %}
</body>
</html>

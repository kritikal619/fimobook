[Service]
# Safety margin for cold startup/upstream latency on a CPU-throttled instance.
# Two processes match the 2-vCPU host; threads keep upstream I/O from blocking all requests.
# Heavy homepage statistics are cached asynchronously in derived_cache.py.
ExecStart=
ExecStart=/home/ubuntu/fimobook/venv/bin/gunicorn --workers 2 --threads 4 --timeout 180 --bind unix:/home/ubuntu/fimobook/fimobook.sock -m 007 app:app

# Cloudflare visitor IP restoration and per-IP origin safety limits.
# Source ranges: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Community traffic has a tighter request budget. All other dynamic routes
# share the general budget and a concurrent-connection ceiling.
limit_req_zone $binary_remote_addr zone=community_per_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dynamic_per_ip:20m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=dynamic_conn_per_ip:10m;
limit_req_zone $binary_remote_addr zone=push_registration_per_ip:10m rate=3r/m;

# Dynamic search pages need a low sustained budget: the incident traffic stayed
# below the general per-second limit while issuing more than a thousand queries.
limit_req_zone $binary_remote_addr zone=search_per_ip:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=autocomplete_per_ip:10m rate=2r/s;

# Reject command-line clients and the stripped Mozilla user agents observed in
# the automated search incident. Full browsers and AdSense crawlers are not
# matched here.
map $http_user_agent $fimobook_search_automation {
    default 0;
    "" 1;
    "Mozilla/5.0" 1;
    "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" 1;
    "~Android 2[.]0; en-us; Droid Build/ESD20" 1;
    ~*(python-requests|curl|wget|scrapy|httpclient|headless|selenium|playwright) 1;
}

# Player read APIs share one budget, so rotating endpoint names does not
# multiply the allowance. Autocomplete has its own typing-friendly budget.
limit_req_zone $binary_remote_addr zone=player_data_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=renewal_page_per_ip:10m rate=6r/m;

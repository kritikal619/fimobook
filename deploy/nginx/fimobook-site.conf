server {
    server_name fcbook.info www.fcbook.info;
    # User-confirmed automated /times requests at 20:43 KST, 2026-10-04.
    if ($remote_addr = 14.53.39.133) { return 403; }

    # Reject abusive traffic at Nginx instead of filling Gunicorn's socket.
    limit_req_status 429;
    limit_conn_status 429;

    # TWA / Digital Asset Links
    location = /.well-known/assetlinks.json {
        alias /home/ubuntu/fimobook/.well-known/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # Dynamic result pages are not indexable content. Block the rotating IPv6
    # /64 seen in the incident and apply a much lower sustained request budget.
    location = /search {
        if ($fimobook_search_automation) { return 403; }
        deny 2406:5900:1177:721c::/64;
        limit_req zone=search_per_ip burst=15 nodelay;
        limit_conn dynamic_conn_per_ip 4;

        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /filtered_players {
        if ($fimobook_search_automation) { return 403; }
        deny 2406:5900:1177:721c::/64;
        limit_req zone=search_per_ip burst=15 nodelay;
        limit_conn dynamic_conn_per_ip 4;

        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /autocomplete {
        if ($fimobook_search_automation) { return 403; }
        deny 2406:5900:1177:721c::/64;
        limit_req zone=autocomplete_per_ip burst=20 nodelay;
        limit_conn dynamic_conn_per_ip 4;

        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Raw harvestable files are not used by the browser. Flask reads the
    # renewal JSON internally and renders /times, keeping its SEO content.
    location = /static/times/cardData.json { return 404; }
    location = /fctimes/cardData.json { return 404; }
    location = /player_data.json { return 404; }
    location = /player_data_old.json { return 404; }

    # Keep the HTML visible to search engines. Reject recognizable script
    # clients and repeated bulk reads; browser disguise is still possible.
    location = /times {
        if ($fimobook_search_automation) { return 403; }
        limit_req zone=renewal_page_per_ip burst=12 nodelay;
        limit_conn dynamic_conn_per_ip 4;
        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # These JSON APIs are already noindex. Flask additionally requires a
    # session-bound token from a site page. All API variants share this limit.
    location ~ ^/api/(?:squad_players|player_compare|player_details_by_name|player_prices|player_price/[0-9]+)$ {
        if ($fimobook_search_automation) { return 403; }
        limit_req zone=player_data_per_ip burst=40 nodelay;
        limit_conn dynamic_conn_per_ip 4;
        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Community endpoints receive a tighter per-visitor safety limit.
    location ^~ /community {
        limit_req zone=community_per_ip burst=20 nodelay;
        limit_conn dynamic_conn_per_ip 12;

        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Player thumbnails are immutable image assets. A result page can request
    # dozens at once, so they must not consume the dynamic page request budget.
    # Keep a separate, higher connection ceiling to protect Gunicorn while
    # allowing HTTP/2 browser image bursts to complete without 429 responses.
    location ^~ /media/player/ {
        limit_conn dynamic_conn_per_ip 64;

        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets are served directly and do not consume Gunicorn capacity.
    location /static/ {
        alias /home/ubuntu/fimobook/static/;
    }

    # Push enrollment validates each token against FCM, so constrain payload
    # size and attempts before Flask performs that external validation.
    location = /api/push/register {
        client_max_body_size 2k;
        limit_req zone=push_registration_per_ip burst=3 nodelay;
        limit_conn dynamic_conn_per_ip 2;

        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All Flask / Gunicorn routes receive a per-visitor safety limit.
    location / {
        limit_req zone=dynamic_per_ip burst=24 nodelay;
        limit_conn dynamic_conn_per_ip 12;

        proxy_pass http://unix:/home/ubuntu/fimobook/fimobook.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fcbook.info/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fcbook.info/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fcbook.info www.fcbook.info;
    if ($remote_addr = 14.53.39.133) { return 403; }
    return 301 https://$host$request_uri;
}

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132531">
  <title>피모북 · 오프라인</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f1f5f9; color: #1f2937; }
    main { width: min(86vw, 420px); box-sizing: border-box; padding: 32px 24px; text-align: center; background: #fff; border-radius: 20px; box-shadow: 0 18px 50px rgba(15, 23, 42, .12); }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { margin: 18px 0 8px; font-size: 24px; }
    p { margin: 0 0 22px; color: #64748b; line-height: 1.6; }
    button { border: 0; border-radius: 12px; padding: 12px 20px; background: #10b981; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e5e7eb; } main { background: #1e293b; } p { color: #94a3b8; } }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/pwa-icon-192.png" alt="피모북">
    <h1>인터넷 연결이 필요해요</h1>
    <p>연결 상태를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>

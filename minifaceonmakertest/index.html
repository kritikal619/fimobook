<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자동 세피아</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="spinner-overlay">
        <div class="spinner"></div>
    </div>

    <h1>세피아 자동 적용 사이트 By 𝐜𝐡𝐫𝐨𝐧𝐢𝐜𝐥𝐞</h1>
    <p>원클릭으로 세피아 자동 적용(주의: 세피아 종류에 따라 약간의 오차 발생 가능) </p>
    <p class="contributors">도움 주신 분: 히어, 호돈까스</p>

    <div id="controls">
        <input type="file" id="image-loader" accept="image/*">
    </div>

    <div id="filters">
        <!-- 필터 버튼들 -->
    </div>

    <div id="image-container">
        <img id="image-display" src="" alt="필터 적용 후 이미지">
    </div>

    <div id="download-container" style="margin-top: 1em; text-align: center;">
        <button id="download-btn" style="display: none;">이미지 다운로드</button>
    </div>

    <script src="main.js"></script>

</body>
</html>
